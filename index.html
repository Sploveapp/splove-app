<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!-- Racine du site : chemins relatifs (./logo.png, ./assets/*) valides sur /auth, /discover, etc. -->
    <base href="/" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="preload" href="/logo.png" as="image" type="image/png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0B0B0F" />
    <meta
      name="format-detection"
      content="telephone=no, address=no, email=no, date=no, url=no"
    />
    <title>SPLove — Rencontres sportives</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background-color: #0b0b0f;
      }
      #root {
        min-height: 100dvh;
        background-color: #0b0b0f;
      }
      #splove-boot-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483646;
        display: flex;
        flex-direction: column;
        min-height: 100dvh;
        background: #0b0b0f;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      }
      #splove-boot-splash .splove-boot-mark {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 0;
      }
      #splove-boot-splash .splove-boot-mark img {
        width: 168px;
        height: 168px;
        object-fit: contain;
        display: block;
      }
      #splove-boot-splash footer {
        flex-shrink: 0;
        text-align: center;
        padding: 0 24px max(28px, env(safe-area-inset-bottom, 0px));
        transform: translateY(-24px);
      }
      #splove-boot-splash .splove-boot-brand {
        margin: 0;
        font-size: 22px;
        font-weight: 700;
        letter-spacing: 0.06em;
        color: rgba(255, 255, 255, 0.92);
      }
      #splove-boot-splash .splove-boot-tagline {
        margin: 8px 0 0;
        font-size: 12px;
        font-weight: 500;
        letter-spacing: 0.16em;
        line-height: 1.45;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.48);
      }
    </style>
  </head>
  <body>
    <div id="splove-boot-splash" role="status" aria-live="polite" aria-label="Chargement de SPLove">
      <div class="splove-boot-mark">
        <img
          src="/logo.png"
          alt=""
          width="168"
          height="168"
          decoding="sync"
          fetchpriority="high"
          draggable="false"
        />
      </div>
      <footer>
        <p class="splove-boot-brand">SPLove</p>
        <p class="splove-boot-tagline">Trouver l'amour par le sport</p>
      </footer>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
